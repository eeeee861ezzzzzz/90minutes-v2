
backend:
  name: github
  repo: eeeee861ezzzzzz/90minutes-v2
  branch: main
  base_url: https://90minutes-auth.benhamouadam42.workers.dev
  auth_endpoint: auth

media_folder: "images"
public_folder: "/90minutes-v2/images"

locale: "fr"

collections:
  - name: "articles"
    label: "Articles"
    folder: "publications"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"

    fields:
      - label: "Titre"
        name: "title"
        widget: "string"

      - label: "Rubrique"
        name: "category"
        widget: "select"
        options:
          - "Actualités"
          - "Analyses tactiques"

      - label: "Championnat"
        name: "league"
        widget: "select"
        required: false
        default: ""
        options:
          - label: "LaLiga"
            value: "liga"

          - label: "Premier League"
            value: "premier-league"

          - label: "Ligue 1"
            value: "ligue-1"

          - label: "Serie A"
            value: "serie-a"

          - label: "Bundesliga"
            value: "bundesliga"

          - label: "Ligue des champions"
            value: "champions-league"

          - label: "Autre compétition"
            value: "autre"

      - label: "Date"
        name: "date"
        widget: "datetime"

      - label: "Image de couverture"
        name: "image"
        widget: "image"
        required: false

      - label: "Introduction"
        name: "description"
        widget: "text"

      - label: "Contenu de l'article"
        name: "body"
        widget: "markdown"
