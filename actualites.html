
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualités | 90MINUTES</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #101923;
      font-family: Arial, sans-serif;
    }

    /* EN-TÊTE ET LOGO */

    header {
      background: #172635;
      padding: 18px 7%;
      border-bottom: 2px solid #d8b46a;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .logo img {
      width: 65px;
      height: 65px;
      object-fit: contain;
      border-radius: 10px;
    }

    .logo-text {
      color: white;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo-text span {
      color: #d8b46a;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      margin-top: 18px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover,
    nav a.active {
      color: #d8b46a;
    }

    /* CONTENU ACTUALITÉS */

    main {
      max-width: 1100px;
      margin: 45px auto;
      padding: 0 22px;
      min-height: 50vh;
    }

    h1 {
      color: #101923;
      font-size: 42px;
      margin-bottom: 20px;
    }

    .subtitle {
      color: #59636e;
      font-size: 18px;
    }

    .articles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 24px;
      margin-top: 35px;
    }

    /* CARTES DES ARTICLES */

    .article {
      background: #ffffff;
      border: 1px solid #e1e5e9;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      transition: transform 0.2s, border-color 0.2s;
    }

    .article:hover {
      transform: translateY(-4px);
      border-color: #d8b46a;
    }

    .article-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
    }

    .article-body {
      padding: 24px;
    }

    .category {
      color: #a17b35;
      font-size: 14px;
      font-weight: bold;
    }

    .article h2 {
      color: #101923;
      font-size: 23px;
      margin: 12px 0;
      line-height: 1.3;
    }

    .article p {
      color: #59636e;
      line-height: 1.6;
    }

    .date {
      font-size: 14px;
      color: #6e7a85;
    }

    .read-more {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 18px;
      background: #d8b46a;
      color: #101923;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .read-more:hover {
      background: #f0cd85;
    }

    .status {
      color: #59636e;
      margin-top: 30px;
    }

    /* PIED DE PAGE */

    footer {
      background: #172635;
      text-align: center;
      padding: 35px 20px;
      color: #c8d0d9;
      margin-top: 70px;
    }

    /* VERSION MOBILE */

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }

      .articles {
        grid-template-columns: 1fr;
      }

      .logo img {
        width: 48px;
        height: 48px;
      }

      .logo-text {
        font-size: 22px;
      }

      .logo {
        gap: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGO ET NAVIGATION -->

  <header>

    <a class="logo" href="index.html">

      <img
        src="Ic%C3%B4ne%20%C2%AB%2090%20%C2%BB%20avec%20ballon%20et%20swoosh%20dor%C3%A9.png"
        alt="Logo 90MINUTES"
      >

      <span class="logo-text">
        90MINUTES<span>.</span>
      </span>

    </a>

    <nav>
      <a href="index.html">Accueil</a>
      <a href="actualites.html" class="active">Actualités</a>
      <a href="analyses.html">Analyses tactiques</a>
      <a href="championnats.html">Championnats</a>
    </nav>

  </header>

  <!-- ACTUALITÉS -->

  <main>

    <h1>Actualités</h1>

    <p class="subtitle">
      Le football décrypté, toute l'actualité.
    </p>

    <p id="status" class="status">
      Chargement des articles...
    </p>

    <div id="articles" class="articles"></div>

  </main>

  <footer>
    © 2026 90MINUTES — LE FOOTBALL DÉCRYPTÉ
  </footer>

  <!-- CHARGEMENT AUTOMATIQUE DES ARTICLES -->

  <script>
    const repo = "eeeee861ezzzzzz/90minutes-v2";

    const api =
      `https://api.github.com/repos/${repo}/contents/publications`;

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function getField(markdown, name) {
      const match = markdown.match(
        new RegExp("^" + name + ":\\s*(.*)$", "m")
      );

      if (!match) return "";

      return match[1]
        .trim()
        .replace(/^["']|["']$/g, "");
    }

    function imageURL(image) {
      if (!image) return "";

      if (image.startsWith("https://")) {
        return image;
      }

      if (image.startsWith("/")) {
        return image;
      }

      return "/90minutes-v2/" + image.replace(/^\/+/, "");
    }

    async function loadArticles() {
      const status = document.getElementById("status");
      const container = document.getElementById("articles");

      try {
        const response = await fetch(api);

        if (!response.ok) {
          throw new Error("Impossible de lire les publications");
        }

        const files = await response.json();

        const markdownFiles = files.filter(file =>
          file.type === "file" && file.name.endsWith(".md")
        );

        const articles = await Promise.all(
          markdownFiles.map(async file => {
            const articleResponse = await fetch(file.download_url);

            if (!articleResponse.ok) {
              throw new Error("Article inaccessible");
            }

            const markdown = await articleResponse.text();

            return {
              title: getField(markdown, "title"),
              category: getField(markdown, "category"),
              date: getField(markdown, "date"),
              description: getField(markdown, "description"),
              image: getField(markdown, "image"),
              slug: file.name.replace(/\.md$/, "")
            };
          })
        );

        const actualites = articles
          .filter(article =>
            article.category === "Actualités"
          )
          .sort((a, b) =>
            new Date(b.date) - new Date(a.date)
          );

        status.textContent = "";

        if (actualites.length === 0) {
          status.textContent =
            "Aucune actualité publiée pour le moment.";
          return;
        }

        actualites.forEach(article => {
          const card = document.createElement("article");
          card.className = "article";

          const image = imageURL(article.image);

          const imageHTML = image
            ? `<img class="article-image"
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(article.title)}">`
            : "";

          const link =
            "article.html?slug=" +
            encodeURIComponent(article.slug);

          card.innerHTML = `
            ${imageHTML}

            <div class="article-body">

              <span class="category">
                ${escapeHTML(article.category)}
              </span>

              <h2>
                ${escapeHTML(article.title)}
              </h2>

              <p>
                ${escapeHTML(article.description)}
              </p>

              <p class="date">
                ${escapeHTML(article.date.slice(0, 10))}
              </p>

              <a class="read-more"
                 href="${escapeHTML(link)}">
                Lire l'article
              </a>

            </div>
          `;

          container.appendChild(card);
        });

      } catch (error) {
        console.error(error);

        status.textContent =
          "Impossible de charger les actualités pour le moment.";
      }
    }

    loadArticles();
  </script>

</body>
</html>
