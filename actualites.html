
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualités | 90MINUTES</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101923;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    header {
      background: #172635;
      padding: 24px 7%;
      border-bottom: 2px solid #d8b46a;
    }
    .logo {
      color: #d8b46a;
      font-size: 28px;
      font-weight: bold;
      text-decoration: none;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      margin-top: 18px;
    }
    nav a { color: white; text-decoration: none; }
    nav a:hover { color: #d8b46a; }
    main { max-width: 1100px; margin: 45px auto; padding: 0 22px; }
    h1 { color: #d8b46a; }
    .subtitle { color: #bac6d0; }
    .articles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 24px;
      margin-top: 35px;
    }
    .article {
      background: #172635;
      border: 1px solid #304456;
      border-radius: 12px;
      padding: 24px;
    }
    .article h2 { margin-top: 0; font-size: 21px; }
    .article p { color: #c8d0d9; line-height: 1.6; }
    .article .category { color: #d8b46a; font-size: 13px; }
    .article a { color: #d8b46a; }
    .status { color: #bac6d0; margin-top: 30px; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">90MINUTES</a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="actualites.html">Actualités</a>
      <a href="analyses.html">Analyses tactiques</a>
      <a href="decryptages.html">Décryptages</a>
    </nav>
  </header>

  <main>
    <h1>Actualités</h1>
    <p class="subtitle">Le football décrypté, toute l'actualité.</p>

    <p id="status" class="status">Chargement des articles...</p>
    <div id="articles" class="articles"></div>
  </main>

  <script>
    const repo = "eeeee861ezzzzzz/90minutes-v2";
    const api = `https://api.github.com/repos/${repo}/contents/publications`;

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function getField(markdown, name) {
      const match = markdown.match(
        new RegExp("^" + name + ":\\s*(.*)$", "m")
      );
      if (!match) return "";
      return match[1].trim().replace(/^["']|["']$/g, "");
    }

    async function loadArticles() {
      const status = document.getElementById("status");
      const container = document.getElementById("articles");

      try {
        const response = await fetch(api);
        if (!response.ok) throw new Error("Impossible de lire les publications");

        const files = await response.json();
        const markdownFiles = files.filter(file => file.name.endsWith(".md"));

        const articles = await Promise.all(markdownFiles.map(async file => {
          const response = await fetch(file.download_url);
          if (!response.ok) throw new Error("Article inaccessible");
          const markdown = await response.text();

          return {
            title: getField(markdown, "title"),
            category: getField(markdown, "category"),
            date: getField(markdown, "date"),
            description: getField(markdown, "description"),
            url: file.html_url
          };
        }));

        const actualites = articles
          .filter(article => article.category === "Actualités")
          .sort((a, b) => new Date(b.date) - new Date(a.date));

        status.textContent = "";

        if (actualites.length === 0) {
          status.textContent = "Aucune actualité publiée pour le moment.";
          return;
        }

        actualites.forEach(article => {
          const card = document.createElement("article");
          card.className = "article";
          card.innerHTML = `
            <span class="category">${escapeHTML(article.category)}</span>
            <h2>${escapeHTML(article.title)}</h2>
            <p>${escapeHTML(article.description)}</p>
            <p>${escapeHTML(article.date.slice(0, 10))}</p>
            <a href="${escapeHTML(article.url)}" target="_blank" rel="noopener noreferrer">
              Voir le fichier publié
            </a>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        status.textContent = "Impossible de charger les actualités pour le moment.";
        console.error(error);
      }
    }

    loadArticles();
  </script>
</body>
</html>
