
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article | 90MINUTES</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101923;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #172635;
      border-bottom: 2px solid #d8b46a;
      padding: 24px 7%;
    }

    .logo {
      color: #d8b46a;
      font-size: 28px;
      font-weight: bold;
      text-decoration: none;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      margin-top: 18px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #d8b46a;
    }

    main {
      max-width: 920px;
      margin: 48px auto;
      padding: 0 22px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #d8b46a;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .article-header {
      border-bottom: 1px solid #304456;
      padding-bottom: 30px;
      margin-bottom: 30px;
    }

    .category {
      display: inline-block;
      color: #101923;
      background: #d8b46a;
      padding: 9px 15px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.2;
      margin: 22px 0;
      letter-spacing: -0.5px;
    }

    .date {
      color: #aebdca;
      font-size: 14px;
      margin: 0;
    }

    .intro {
      color: #d0d9e2;
      font-size: 21px;
      line-height: 1.75;
      margin: 25px 0 30px;
      font-weight: 400;
    }

    .cover {
      display: block;
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      border-radius: 12px;
      margin: 30px 0 42px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.22);
    }

    .content {
      max-width: 760px;
      margin: 0 auto;
      font-size: 18px;
      line-height: 1.95;
      overflow-wrap: anywhere;
      color: #e5eaf0;
    }

    .content p {
      margin: 0 0 25px;
    }

    .content h2,
    .content h3 {
      color: #d8b46a;
      line-height: 1.35;
      margin-top: 40px;
      margin-bottom: 18px;
    }

    .content h2 {
      font-size: 28px;
    }

    .content h3 {
      font-size: 23px;
    }

    .content a {
      color: #d8b46a;
    }

    .content img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin: 15px 0;
    }

    .content blockquote {
      border-left: 4px solid #d8b46a;
      padding: 12px 20px;
      margin: 30px 0;
      background: #172635;
      color: #c8d2dc;
      border-radius: 0 8px 8px 0;
    }

    .content pre {
      overflow-x: auto;
      background: #172635;
      padding: 18px;
      border-radius: 8px;
    }

    .content ul,
    .content ol {
      padding-left: 25px;
      margin-bottom: 25px;
    }

    .content li {
      margin-bottom: 10px;
    }

    .article-bottom {
      border-top: 1px solid #304456;
      margin-top: 55px;
      padding-top: 30px;
    }

    .bottom-link {
      display: inline-block;
      background: #d8b46a;
      color: #101923;
      text-decoration: none;
      font-weight: bold;
      padding: 14px 22px;
      border-radius: 7px;
    }

    .bottom-link:hover {
      background: #f0cd85;
    }

    .status {
      color: #c8d2dc;
    }

    footer {
      text-align: center;
      padding: 35px;
      color: #aebdca;
      border-top: 1px solid #304456;
      margin-top: 70px;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px 6%;
      }

      .logo {
        font-size: 24px;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 14px;
      }

      main {
        margin: 30px auto;
        padding: 0 18px;
      }

      h1 {
        font-size: 32px;
      }

      .intro {
        font-size: 18px;
      }

      .content {
        font-size: 17px;
        line-height: 1.85;
      }

      .content h2 {
        font-size: 24px;
      }

      .cover {
        margin: 25px 0 35px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="logo" href="index.html">90MINUTES</a>

    <nav>
      <a href="index.html">Accueil</a>
      <a href="actualites.html">Actualités</a>
      <a href="analyses.html">Résumés de matchs</a>
      <a href="championnats.html">Championnats</a>
    </nav>
  </header>

  <main>

    <a id="back-link" class="back" href="actualites.html">
      ← Retour aux actualités
    </a>

    <p id="status" class="status">
      Chargement de l'article...
    </p>

    <article id="article" hidden>

      <div class="article-header">
        <span id="category" class="category"></span>

        <h1 id="title"></h1>

        <p id="date" class="date"></p>
      </div>

      <p id="description" class="intro"></p>

      <img id="cover" class="cover" alt="" hidden>

      <div id="content" class="content"></div>

      <div class="article-bottom">
        <a id="bottom-link" class="bottom-link" href="actualites.html">
          ← Retour aux actualités
        </a>
      </div>

    </article>

  </main>

  <footer>
    © 2026 90MINUTES — LE FOOTBALL DÉCRYPTÉ
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <script>
    const REPO = "eeeee861ezzzzzz/90minutes-v2";
    const BASE = "/90minutes-v2/";

    function field(frontmatter, name) {
      const lines = frontmatter.split(/\r?\n/);
      const line = lines.find(item =>
        item.startsWith(name + ":")
      );

      if (!line) return "";

      let value = line.slice(name.length + 1).trim();

      if (
        (value.startsWith('"') && value.endsWith('"')) ||
        (value.startsWith("'") && value.endsWith("'"))
      ) {
        value = value.slice(1, -1);
      }

      return value;
    }

    function formatDate(date) {
      if (!date) return "";

      const parsed = new Date(date);

      if (Number.isNaN(parsed.getTime())) {
        return date.slice(0, 10);
      }

      return parsed.toLocaleDateString("fr-FR", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    function updateBackLinks(category) {
      const isSummary =
        category === "Résumés de matchs" ||
        category === "Analyses tactiques";

      const href = isSummary
        ? "analyses.html"
        : "actualites.html";

      const label = isSummary
        ? "← Retour aux résumés de matchs"
        : "← Retour aux actualités";

      const backLink = document.getElementById("back-link");
      const bottomLink = document.getElementById("bottom-link");

      backLink.href = href;
      backLink.textContent = label;

      bottomLink.href = href;
      bottomLink.textContent = label;
    }

    async function loadArticle() {
      const status = document.getElementById("status");
      const params = new URLSearchParams(location.search);
      const slug = params.get("slug");

      if (!slug || !/^[a-zA-Z0-9_-]+$/.test(slug)) {
        status.textContent = "Article introuvable.";
        return;
      }

      try {
        const url =
          `https://raw.githubusercontent.com/${REPO}/main/publications/${slug}.md`;

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Article introuvable");
        }

        const markdown = await response.text();

        const match = markdown.match(
          /^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?([\s\S]*)$/
        );

        if (!match) {
          throw new Error("Format de l'article invalide");
        }

        const frontmatter = match[1];
        const body = match[2];

        const title = field(frontmatter, "title");
        const category = field(frontmatter, "category");
        const date = field(frontmatter, "date");

        const description =
          field(frontmatter, "introduction") ||
          field(frontmatter, "description");

        const image = field(frontmatter, "image");

        document.title = (title || "Article") + " | 90MINUTES";

        document.getElementById("title").textContent = title;

        document.getElementById("category").textContent =
          category === "Analyses tactiques"
            ? "Résumés de matchs"
            : category;

        document.getElementById("date").textContent =
          "Publié le " + formatDate(date);

        document.getElementById("description").textContent =
          description;

        updateBackLinks(category);

        const cover = document.getElementById("cover");

        if (image) {
          const imageUrl = image.startsWith("https://")
            ? image
            : image.startsWith("/")
              ? image
              : BASE + image.replace(/^\/+/, "");

          cover.src = imageUrl;
          cover.alt = title;
          cover.hidden = false;
        }

        const content = document.getElementById("content");

        if (window.marked && window.DOMPurify) {
          content.innerHTML = DOMPurify.sanitize(
            marked.parse(body)
          );
        } else {
          content.textContent = body;
        }

        document.getElementById("article").hidden = false;
        status.hidden = true;

      } catch (error) {
        console.error(error);

        status.textContent =
          "Impossible de charger cet article pour le moment.";
      }
    }

    loadArticle();
  </script>

</body>
</html>
