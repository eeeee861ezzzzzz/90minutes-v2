
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article | 90MINUTES</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101923;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #172635;
      border-bottom: 2px solid #d8b46a;
      padding: 24px 7%;
    }

    .logo {
      color: #d8b46a;
      font-size: 28px;
      font-weight: bold;
      text-decoration: none;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      margin-top: 18px;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    nav a:hover { color: #d8b46a; }

    main {
      max-width: 850px;
      margin: 55px auto;
      padding: 0 22px;
    }

    .back {
      color: #d8b46a;
      text-decoration: none;
    }

    .category {
      display: inline-block;
      color: #d8b46a;
      margin-top: 35px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .date {
      color: #aebdca;
      margin-bottom: 30px;
    }

    .intro {
      color: #d0d9e2;
      font-size: 21px;
      line-height: 1.7;
    }

    .cover {
      display: block;
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      border-radius: 12px;
      margin: 35px 0;
    }

    .content {
      font-size: 18px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .content h2,
    .content h3 {
      color: #d8b46a;
      margin-top: 35px;
    }

    .content a { color: #d8b46a; }

    .content img {
      max-width: 100%;
      border-radius: 10px;
    }

    .content blockquote {
      border-left: 3px solid #d8b46a;
      padding-left: 18px;
      color: #c8d2dc;
    }

    .content pre {
      overflow-x: auto;
      background: #172635;
      padding: 15px;
      border-radius: 8px;
    }

    .status { color: #c8d2dc; }

    footer {
      text-align: center;
      padding: 35px;
      color: #aebdca;
      border-top: 1px solid #304456;
      margin-top: 70px;
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="index.html">90MINUTES</a>

    <nav>
      <a href="index.html">Accueil</a>
      <a href="actualites.html">Actualités</a>
      <a href="analyses.html">Analyses tactiques</a>
      <a href="decryptages.html">Décryptages</a>
    </nav>
  </header>

  <main>
    <a class="back" href="actualites.html">← Retour aux actualités</a>

    <p id="status" class="status">Chargement de l'article...</p>

    <article id="article" hidden>
      <span id="category" class="category"></span>
      <h1 id="title"></h1>
      <p id="date" class="date"></p>
      <p id="description" class="intro"></p>
      <img id="cover" class="cover" alt="" hidden>
      <div id="content" class="content"></div>
    </article>
  </main>

  <footer>
    © 2026 90MINUTES — LE FOOTBALL DÉCRYPTÉ
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <script>
    const REPO = "eeeee861ezzzzzz/90minutes-v2";
    const BASE = "/90minutes-v2/";

    function field(frontmatter, name) {
      const lines = frontmatter.split(/\r?\n/);
      const line = lines.find(item =>
        item.startsWith(name + ":")
      );

      if (!line) return "";

      let value = line.slice(name.length + 1).trim();

      if (
        (value.startsWith('"') && value.endsWith('"')) ||
        (value.startsWith("'") && value.endsWith("'"))
      ) {
        value = value.slice(1, -1);
      }

      return value;
    }

    async function loadArticle() {
      const status = document.getElementById("status");
      const params = new URLSearchParams(location.search);
      const slug = params.get("slug");

      if (!slug || !/^[a-zA-Z0-9_-]+$/.test(slug)) {
        status.textContent = "Article introuvable.";
        return;
      }

      try {
        const url =
          `https://raw.githubusercontent.com/${REPO}/main/publications/${slug}.md`;

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Article introuvable");
        }

        const markdown = await response.text();
        const match = markdown.match(
          /^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?([\s\S]*)$/
        );

        if (!match) {
          throw new Error("Format de l'article invalide");
        }

        const frontmatter = match[1];
        const body = match[2];

        const title = field(frontmatter, "title");
        const category = field(frontmatter, "category");
        const date = field(frontmatter, "date");
        const description = field(frontmatter, "description");
        const image = field(frontmatter, "image");

        document.title = (title || "Article") + " | 90MINUTES";

        document.getElementById("title").textContent = title;
        document.getElementById("category").textContent = category;
        document.getElementById("date").textContent =
          date.slice(0, 10);
        document.getElementById("description").textContent =
          description;

        const cover = document.getElementById("cover");

        if (image) {
          const imageUrl = image.startsWith("https://")
            ? image
            : image.startsWith("/")
              ? image
              : BASE + image.replace(/^\/+/, "");

          cover.src = imageUrl;
          cover.alt = title;
          cover.hidden = false;
        }

        const content = document.getElementById("content");

        if (window.marked && window.DOMPurify) {
          content.innerHTML = DOMPurify.sanitize(
            marked.parse(body)
          );
        } else {
          content.textContent = body;
        }

        document.getElementById("article").hidden = false;
        status.hidden = true;

      } catch (error) {
        console.error(error);
        status.textContent =
          "Impossible de charger cet article pour le moment.";
      }
    }

    loadArticle();
  </script>
</body>
</html>
